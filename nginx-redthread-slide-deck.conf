# /etc/nginx/sites-available/redthread-slide-deck
#
# gunicorn only listens on 127.0.0.1 (see the systemd service file) --
# nginx is what's actually exposed to the internet, handling TLS and
# proxying through. This is a meaningfully safer split than binding
# gunicorn directly to 0.0.0.0 on a bare VM with no isolation between
# the app process and the network.
#
# Run `sudo certbot --nginx -d your-domain.example.com` after enabling
# this site to get a real TLS certificate for free (Let's Encrypt) --
# certbot will rewrite this file to add the HTTPS block automatically.

server {
    listen 80;
    server_name your-domain.example.com;

    client_max_body_size 25M;  # room for PDF lesson uploads

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # matches gunicorn's --timeout
    }
}
